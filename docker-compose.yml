version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Primary Web & WebSocket Service (Daphne ASGI)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ftcr_web
    restart: unless-stopped
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DEBUG=True
      - POSTGRES_DB=${POSTGRES_DB:-cyberrange_db}
      - POSTGRES_USER=${POSTGRES_USER:-cyberrange_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cyberrange_secure_password_2026!}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:cyberrange_redis_secret@redis:6379/0
      - CELERY_BROKER_URL=redis://:cyberrange_redis_secret@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:cyberrange_redis_secret@redis:6379/2
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - ftcr_internal_net

  # ----------------------------------------------------------------------------
  # Relational Database (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: ftcr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyberrange_db}
      POSTGRES_USER: ${POSTGRES_USER:-cyberrange_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberrange_secure_password_2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ftcr_internal_net

  # ----------------------------------------------------------------------------
  # In-Memory Cache, Channel Layer & Message Broker (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ftcr_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-cyberrange_redis_secret}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - ftcr_internal_net

  # ----------------------------------------------------------------------------
  # Celery Asynchronous Worker (Lab Provisioner & Task Processor)
  # ----------------------------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ftcr_celery_worker
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info", "-c", "4"]
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - POSTGRES_DB=${POSTGRES_DB:-cyberrange_db}
      - POSTGRES_USER=${POSTGRES_USER:-cyberrange_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cyberrange_secure_password_2026!}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:cyberrange_redis_secret@redis:6379/0
      - CELERY_BROKER_URL=redis://:cyberrange_redis_secret@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:cyberrange_redis_secret@redis:6379/2
    depends_on:
      - db
      - redis
    networks:
      - ftcr_internal_net

  # ----------------------------------------------------------------------------
  # Celery Beat Scheduler (Lab Auto-Expiry Reaper)
  # ----------------------------------------------------------------------------
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ftcr_celery_beat
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - POSTGRES_DB=${POSTGRES_DB:-cyberrange_db}
      - POSTGRES_USER=${POSTGRES_USER:-cyberrange_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cyberrange_secure_password_2026!}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:cyberrange_redis_secret@redis:6379/0
      - CELERY_BROKER_URL=redis://:cyberrange_redis_secret@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:cyberrange_redis_secret@redis:6379/2
    depends_on:
      - db
      - redis
    networks:
      - ftcr_internal_net

  # ----------------------------------------------------------------------------
  # Edge Proxy & Web Server (Nginx)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: ftcr_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - ftcr_internal_net

networks:
  ftcr_internal_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

