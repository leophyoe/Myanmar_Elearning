version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Primary Web & WebSocket Service (Daphne ASGI)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ftcr_web
    restart: unless-stopped
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.production}
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      - POSTGRES_DB=${POSTGRES_DB:-thuta_prod_db}
      - POSTGRES_USER=${POSTGRES_USER:-thuta_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    networks:
      - ftcr_internal_net

  # ----------------------------------------------------------------------------
  # Relational Database (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: ftcr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thuta_prod_db}
      POSTGRES_USER: ${POSTGRES_USER:-thuta_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - ftcr_internal_net

  # ----------------------------------------------------------------------------
  # In-Memory Cache, Channel Layer & Message Broker (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ftcr_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - ftcr_internal_net

  # ----------------------------------------------------------------------------
  # Celery Asynchronous Worker (Lab Provisioner & Task Processor)
  # ----------------------------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ftcr_celery_worker
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info", "-c", "4"]
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.production}
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_DB=${POSTGRES_DB:-thuta_prod_db}
      - POSTGRES_USER=${POSTGRES_USER:-thuta_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      - db
      - redis
    networks:
      - ftcr_internal_net

  # ----------------------------------------------------------------------------
  # Celery Beat Scheduler (Lab Auto-Expiry Reaper)
  # ----------------------------------------------------------------------------
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ftcr_celery_beat
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.production}
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_DB=${POSTGRES_DB:-thuta_prod_db}
      - POSTGRES_USER=${POSTGRES_USER:-thuta_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      - db
      - redis
    networks:
      - ftcr_internal_net

  # ----------------------------------------------------------------------------
  # Edge Proxy & Web Server (Nginx)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: ftcr_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - ftcr_internal_net

  # ----------------------------------------------------------------------------
  # OpenVPN Gateway Service (Hack The Box / TryHackMe Subnet Access)
  # ----------------------------------------------------------------------------
  openvpn:
    image: kylemanna/openvpn:latest
    container_name: ftcr_openvpn
    restart: unless-stopped
    ports:
      - "1194:1194/udp"
    cap_add:
      - NET_ADMIN
    volumes:
      - openvpn_data:/etc/openvpn
    networks:
      - ftcr_internal_net
      - ftcr_lab_network
    sysctls:
      - net.ipv4.ip_forward=1

networks:
  ftcr_internal_net:
    driver: bridge
  ftcr_lab_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.10.0.0/16
          gateway: 10.10.0.1

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  openvpn_data:

