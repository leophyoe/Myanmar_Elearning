version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Django Web & Application Service
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: futuretech_academy_web
    restart: unless-stopped
    command: ["python", "backend/manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DEBUG=True
      - POSTGRES_DB=${POSTGRES_DB:-futuretech_academy_db}
      - POSTGRES_USER=${POSTGRES_USER:-futuretech_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-futuretech_secure_pass_2026!}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - academy_internal_net

  # ----------------------------------------------------------------------------
  # PostgreSQL 16 (Not Exposed Publicly)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: futuretech_academy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-futuretech_academy_db}
      POSTGRES_USER: ${POSTGRES_USER:-futuretech_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-futuretech_secure_pass_2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - academy_internal_net

  # ----------------------------------------------------------------------------
  # In-Memory Cache & Message Broker (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: futuretech_academy_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - academy_internal_net

networks:
  academy_internal_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

