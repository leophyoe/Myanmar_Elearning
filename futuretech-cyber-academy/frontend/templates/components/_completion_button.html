{% if completed %}
<button 
    hx-post="{% url 'toggle-lesson-complete' lesson.id %}"
    hx-swap="outerHTML"
    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
    class="inline-flex items-center space-x-2 px-4 py-2.5 rounded-lg bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/40 text-sm font-semibold transition group focus:ring-2 focus:ring-emerald-500 focus:outline-none"
    aria-pressed="true"
    title="Click to mark lesson incomplete">
    <svg class="w-4 h-4 text-emerald-400 fill-current" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
    </svg>
    <span>Completed</span>
    <span class="text-xs text-emerald-300/70 group-hover:text-emerald-300 font-normal ml-1">(Undo)</span>
</button>
{% else %}
<button 
    hx-post="{% url 'toggle-lesson-complete' lesson.id %}"
    hx-swap="outerHTML"
    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
    class="inline-flex items-center space-x-2 px-4 py-2.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white text-sm font-semibold shadow-md shadow-cyan-600/20 transition focus:ring-2 focus:ring-cyan-400 focus:outline-none"
    aria-pressed="false"
    title="Mark this lesson as complete">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    </svg>
    <span>Mark as Complete</span>
</button>
{% endif %}
