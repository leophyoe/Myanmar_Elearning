version: '3.8'

services:
  juice-shop:
    image: bkimminich/juice-shop:v17.1.1
    container_name: ftc_juice_shop_target
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=unsafe
    networks:
      - cyber_range_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
          pids: 150
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

networks:
  cyber_range_net:
    driver: bridge
    internal: false

