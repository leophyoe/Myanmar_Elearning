{% extends 'base.html' %}

{% block title %}Contact Restriction | THUTA Messenger{% endblock %}

{% block content %}
<div class="min-w-0 max-w-lg mx-auto py-12 px-4 sm:px-6">
    <div class="bg-white dark:bg-[#111C2E] border border-slate-200 dark:border-[#26364B] rounded-2xl p-6 sm:p-8 text-center shadow-lg">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-100 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 flex items-center justify-center text-2xl mb-4">
            🔒
        </div>
        <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-2">
            <span class="lang-en">Direct Messaging Restricted</span>
            <span class="lang-my">တိုက်ရိုက် စာပို့ခွင့် ကန့်သတ်ချက်</span>
        </h2>
        <p class="text-sm text-slate-600 dark:text-slate-300 mb-6 leading-relaxed">
            {{ reason }}
        </p>
        <div class="flex items-center justify-center gap-3">
            <a href="{% url 'chat:inbox' %}" class="px-4 py-2 text-xs font-semibold rounded-xl bg-[#0284C7] hover:bg-[#0369A1] dark:bg-[#38BDF8] dark:hover:bg-[#7DD3FC] text-white dark:text-[#0B1220] transition shadow-sm">
                <span class="lang-en">Return to Messenger</span>
                <span class="lang-my">မက်ဆင်ဂျာသို့ ပြန်သွားရန်</span>
            </a>
            <a href="{% url 'course-list' %}" class="px-4 py-2 text-xs font-semibold rounded-xl border border-slate-200 dark:border-[#26364B] text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 transition">
                <span class="lang-en">Browse Courses</span>
                <span class="lang-my">သင်ရိုးများ ကြည့်ရန်</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
