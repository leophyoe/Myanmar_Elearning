<script>
    (function () {
        function applyLanguage(lang) {
            var el = document.documentElement;
            el.setAttribute('data-lang', lang);
            el.classList.toggle('lang-en', lang === 'en');
            el.classList.toggle('lang-my', lang === 'my');
            try { localStorage.setItem('mel-lang', lang); } catch (e) {}
            document.cookie = "mel_lang=" + lang + ";path=/;max-age=31536000;SameSite=Lax";
            
            // Update placeholders with data-placeholder-en / data-placeholder-my
            document.querySelectorAll('[data-placeholder-en]').forEach(function(input) {
                var ph = (lang === 'my') ? input.getAttribute('data-placeholder-my') : input.getAttribute('data-placeholder-en');
                if (ph) { input.setAttribute('placeholder', ph); }
            });

            // Update titles and aria-labels with data-title-en / data-title-my
            document.querySelectorAll('[data-title-en]').forEach(function(item) {
                var title = (lang === 'my') ? item.getAttribute('data-title-my') : item.getAttribute('data-title-en');
                if (title) {
                    item.setAttribute('title', title);
                    item.setAttribute('aria-label', title);
                }
            });

            // Update text content for elements that cannot contain child HTML spans (e.g. <option>)
            document.querySelectorAll('[data-text-en]').forEach(function(item) {
                var txt = (lang === 'my') ? item.getAttribute('data-text-my') : item.getAttribute('data-text-en');
                if (txt !== null && txt !== undefined) {
                    item.textContent = txt;
                }
            });
        }

        document.addEventListener('click', function (event) {
            var target = event.target;
            if (!target || !target.closest) { return; }
            if (!target.closest('[data-lang-toggle]')) { return; }
            var current = document.documentElement.getAttribute('data-lang') || 'en';
            var nextLang = (current === 'en') ? 'my' : 'en';
            applyLanguage(nextLang);
        });

        // Initialize placeholders and titles on DOM load
        document.addEventListener('DOMContentLoaded', function() {
            var current = document.documentElement.getAttribute('data-lang') || 'en';
            applyLanguage(current);
        });
    })();
</script>
