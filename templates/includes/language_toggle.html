<div class="relative inline-flex items-center" data-lang-switcher>
    <button type="button" data-lang-toggle
            title="Switch Language / ဘာသာစကား ပြောင်းလဲမည်" aria-label="Switch Language"
            class="text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 hover:border-slate-500 bg-slate-900/80 hover:bg-slate-800 text-slate-300 hover:text-white transition flex items-center gap-1.5 font-mono shadow-sm">
        <span class="text-xs leading-none" aria-hidden="true">🌐</span>
        <span class="lang-badge-en">EN</span>
        <span class="text-slate-600 text-[10px]">/</span>
        <span class="lang-badge-my">MY</span>
    </button>
</div>
