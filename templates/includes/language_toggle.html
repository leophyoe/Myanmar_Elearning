<div class="relative inline-flex items-center" data-lang-switcher>
    <button type="button" data-lang-toggle
            title="Switch Language" aria-label="Switch Language"
            data-title-en="Switch Language" data-title-my="ဘာသာစကား ပြောင်းလဲမည်"
            class="text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-[#26364B] bg-white dark:bg-[#111C2E] hover:bg-slate-50 dark:hover:bg-[#162235] text-slate-700 dark:text-slate-300 hover:text-slate-950 dark:hover:text-white transition flex items-center gap-1.5 font-mono shadow-xs">
        <span class="text-xs leading-none" aria-hidden="true">🌐</span>
        <span class="lang-badge-en">EN</span>
        <span class="text-slate-400 dark:text-slate-600 text-[10px]">/</span>
        <span class="lang-badge-my">MY</span>
    </button>
</div>
