<button type="button" data-theme-toggle
        title="Switch colour theme" aria-label="Switch colour theme"
        class="text-sm px-2.5 py-1.5 rounded border border-slate-700 hover:border-slate-500 text-slate-300 hover:text-white transition leading-none">
    <span class="theme-to-light" aria-hidden="true">☀️</span><span class="theme-to-dark" aria-hidden="true">🌙</span>
</button>
