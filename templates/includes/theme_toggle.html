<button type="button" data-theme-toggle
        title="Switch colour theme" aria-label="Switch colour theme"
        class="text-sm px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-[#111C2E] hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition shadow-sm leading-none flex items-center justify-center">
    <span class="theme-to-light" aria-hidden="true">☀️</span><span class="theme-to-dark" aria-hidden="true">🌙</span>
</button>
