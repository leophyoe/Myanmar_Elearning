<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal: {{ instance.lab.title }} - {{ PLATFORM_NAME }}</title>
    <!-- xterm.js CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #080c16; margin: 0; padding: 0; overflow: hidden; font-family: monospace; }
        #terminal-container { width: 100vw; height: calc(100vh - 48px); }
    </style>
</head>
<body class="text-slate-300">

    <!-- Top Status Header -->
    <header class="h-12 bg-slate-900 border-b border-slate-800 px-4 flex items-center justify-between text-xs">
        <div class="flex items-center space-x-3">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="font-bold text-white tracking-wider">{{ instance.lab.title }}</span>
            <span class="text-slate-500">•</span>
            <span class="text-cyan-400 font-mono">{{ instance.target_ip|default:"172.30.1.100" }}</span>
        </div>

        <div class="flex items-center space-x-4">
            <div id="connection-badge" class="px-2 py-0.5 rounded bg-cyan-950 border border-cyan-800 text-cyan-300 font-mono text-[11px]">
                Connecting...
            </div>
            <button onclick="term.clear()" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px]">
                Clear Screen
            </button>
            <button onclick="window.close()" class="px-2.5 py-1 rounded bg-red-950 hover:bg-red-900 text-red-300 text-[11px]">
                Close Window
            </button>
        </div>
    </header>

    <!-- Terminal Canvas -->
    <div id="terminal-container" class="p-2"></div>

    <script>
        const instanceId = "{{ instance.id }}";
        const badge = document.getElementById("connection-badge");

        // Initialize xterm.js instance
        const term = new Terminal({
            cursorBlink: true,
            theme: {
                background: '#080c16',
                foreground: '#e2e8f0',
                cursor: '#00f0ff',
                selectionBackground: 'rgba(6, 182, 212, 0.3)',
                black: '#0f172a',
                red: '#ef4444',
                green: '#10b981',
                yellow: '#f59e0b',
                blue: '#3b82f6',
                magenta: '#a855f7',
                cyan: '#06b6d4',
                white: '#f8fafc',
            },
            fontFamily: 'Courier New, Courier, monospace',
            fontSize: 14,
            lineHeight: 1.2
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();

        window.addEventListener('resize', () => fitAddon.fit());

        // Setup WebSocket
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/terminal/${instanceId}/`;
        const ws = new WebSocket(wsUrl);

        ws.onopen = function () {
            badge.textContent = "CONNECTED";
            badge.className = "px-2 py-0.5 rounded bg-emerald-950 border border-emerald-800 text-emerald-300 font-mono text-[11px]";
        };

        ws.onmessage = function (event) {
            term.write(event.data);
        };

        ws.onclose = function () {
            badge.textContent = "DISCONNECTED";
            badge.className = "px-2 py-0.5 rounded bg-red-950 border border-red-800 text-red-300 font-mono text-[11px]";
            term.write('\r\n\x1b[31m[Session terminated or container expired]\x1b[0m\r\n');
        };

        ws.onerror = function (err) {
            badge.textContent = "ERROR";
            badge.className = "px-2 py-0.5 rounded bg-red-950 border border-red-800 text-red-300 font-mono text-[11px]";
        };

        // Forward user keystrokes to WebSocket
        term.onData(data => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(data);
            }
        });
    </script>
</body>
</html>
