{% extends "base.html" %}

{% block title %}Password Updated — Myanmar E-Learning{% endblock %}

{% block content %}
<div class="min-h-screen bg-slate-50 flex items-center justify-center py-12 px-4 sm:px-6">
    <div class="max-w-md w-full bg-white border border-slate-200 rounded-xl p-8 text-center shadow-sm space-y-4">
        <div class="w-14 h-14 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto text-xl font-bold">
            ✓
        </div>
        <h1 class="text-xl font-bold text-slate-900">Password Updated Successfully</h1>
        <p class="text-xs text-slate-600">Your account password has been updated. You can now use your new credentials across all devices.</p>
        <div class="pt-4 border-t border-slate-100 flex justify-center gap-3">
            <a href="{% url 'profile' %}" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg transition">
                Back to Profile
            </a>
            <a href="{% url 'dashboard' %}" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition">
                Go to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
