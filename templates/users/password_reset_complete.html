{% extends "base.html" %}

{% block title %}Password Reset Complete — Myanmar E-Learning{% endblock %}

{% block content %}
<div class="min-h-screen bg-slate-50 flex items-center justify-center py-12 px-4 sm:px-6">
    <div class="max-w-md w-full bg-white border border-slate-200 rounded-xl p-8 text-center shadow-sm space-y-4">
        <div class="w-14 h-14 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto text-xl font-bold">
            ✓
        </div>
        <h1 class="text-xl font-bold text-slate-900">Password Reset Complete</h1>
        <p class="text-xs text-slate-600">Your password has been reset successfully. You may now sign in with your new credentials.</p>
        <div class="pt-4 border-t border-slate-100 flex justify-center">
            <a href="{% url 'login' %}" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg transition">
                Sign In Now
            </a>
        </div>
    </div>
</div>
{% endblock %}
